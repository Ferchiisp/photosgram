<ion-header>
  <ion-toolbar>
    <ion-title>Photosgram</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Historias -->
  <div class="stories">
    <div *ngFor="let story of stories" class="story">
      <img [src]="story.image" alt="Story">
      <p>{{ story.username }}</p>
    </div>
  </div>
  

  <!-- Publicaciones -->
  <ion-list>
    <div *ngFor="let post of posts" class="post">
      <ion-item lines="none">
        <ion-avatar slot="start">
          <img [src]="post.profilePic" alt="User">
        </ion-avatar>
        <ion-label>
          <h2>{{ post.username }}</h2>
        </ion-label>
      </ion-item>

      <img [src]="post.image" class="post-img" alt="Post">

      <div class="post-actions">
        <ion-icon name="heart-outline"></ion-icon>
        <ion-icon name="chatbubble-outline"></ion-icon>
        <ion-icon name="paper-plane-outline"></ion-icon>
      </div>

      <p class="likes">{{ post.likes }} Me gusta</p>
      <p><strong>{{ post.username }}</strong> {{ post.caption }}</p>
    </div>
  </ion-list>
</ion-content>
